services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codenames
      POSTGRES_PASSWORD: codenames
      POSTGRES_DB: codenames
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codenames']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
